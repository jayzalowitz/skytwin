<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SkyTwin — Your Personal AI Assistant</title>
  <link rel="icon" id="favicon" type="image/svg+xml" href='data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32"><circle cx="16" cy="16" r="15" fill="%231976d2"/><text x="16" y="22" font-family="-apple-system,system-ui,sans-serif" font-size="18" font-weight="700" text-anchor="middle" fill="white">S</text></svg>'>
  <link rel="stylesheet" href="/css/styles.css">
  <link rel="stylesheet" href="/css/themes.css">
  <link rel="stylesheet" href="/css/assistant.css">
  <script type="module">
    // Apply theme before paint to prevent flash
    const v = localStorage.getItem('skytwin_theme_variant') || 'quiet-confidence';
    const m = localStorage.getItem('skytwin_theme_mode') || 'dark';
    document.documentElement.setAttribute('data-variant', v);
    document.documentElement.setAttribute('data-mode', m);
  </script>
</head>
<body>
  <!-- Onboarding overlay (shown on first visit) -->
  <div id="onboarding-overlay" class="onboarding-overlay" style="display: none;">
    <div class="onboarding-card">
      <div id="onboarding-content"></div>
    </div>
  </div>

  <div class="mobile-backdrop" id="mobile-backdrop"></div>
  <nav class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <h1>SkyTwin</h1>
      <span class="subtitle">Your AI Assistant</span>
    </div>
    <button class="mobile-menu-btn" id="mobile-menu-btn" aria-label="Toggle menu">
      <span></span><span></span><span></span>
    </button>
    <ul class="nav-links" id="nav-links">
      <li><a href="#/" class="nav-link active" data-page="dashboard">Home</a></li>
      <li><a href="#/assistant" class="nav-link" data-page="assistant">Chat</a></li>
      <li><a href="#/approvals" class="nav-link" data-page="approvals">
        Needs your OK
        <span class="nav-badge" id="approval-count" style="display:none;">0</span>
      </a></li>
      <li><a href="#/decisions" class="nav-link" data-page="decisions">What happened</a></li>
      <li><a href="#/twin" class="nav-link" data-page="twin">What I've learned</a></li>
      <li><a href="#/audit" class="nav-link" data-page="audit">Audit trail</a></li>
      <li><a href="#/settings" class="nav-link" data-page="settings">Settings</a></li>
      <li><a href="#/setup" class="nav-link" data-page="setup">Connect</a></li>
    </ul>
    <div class="sidebar-footer">
      <div class="connection-status" id="connection-status">
        <span class="status-dot"></span>
        <span class="status-text">Checking...</span>
      </div>
    </div>
  </nav>

  <main class="content" id="content">
    <div class="page-header">
      <h2 id="page-title">Dashboard</h2>
      <div class="user-badge" id="user-badge"></div>
    </div>
    <!-- Connection status banner (UX review #12). Hidden by default;
         app.js shows it only when the API is unreachable. Clickable for
         manual retry. -->
    <div id="connection-banner" class="connection-banner" hidden>
      <span class="connection-banner-dot"></span>
      <span class="connection-banner-text">Reconnecting…</span>
      <button class="connection-banner-retry" type="button" data-action="connection-retry">Retry now</button>
    </div>
    <div id="page-content">
      <!-- Dynamic content loaded here -->
    </div>
  </main>

  <!-- Bottom nav (mobile) — UX review #3 (P0).
       Pre-fix had single-letter icons (H/!/D/T/S) that were mysterious
       to first-time users, missed the new Chat link entirely, and the
       nav overlapped page content (no body offset).
       Now: real inline-SVG icons, Chat included, page-content has a
       safe-area + nav-height padding-bottom (see styles.css). -->
  <nav class="bottom-nav" id="bottom-nav" aria-label="Primary mobile navigation">
    <ul class="bottom-nav-items">
      <li><a href="#/" class="bottom-nav-link" data-page="dashboard" aria-label="Home">
        <span class="bottom-nav-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11.5 12 4l9 7.5"/><path d="M5 10v10h14V10"/></svg>
        </span>Home
      </a></li>
      <li><a href="#/assistant" class="bottom-nav-link" data-page="assistant" aria-label="Chat">
        <span class="bottom-nav-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a8 8 0 0 1-8 8H7l-4 3v-7.5A8 8 0 0 1 11 4h2a8 8 0 0 1 8 8z"/></svg>
        </span>Chat
      </a></li>
      <li><a href="#/approvals" class="bottom-nav-link" data-page="approvals" aria-label="Approvals">
        <span class="bottom-nav-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 12l2 2 4-4"/><circle cx="12" cy="12" r="9"/></svg>
        </span>Approvals
        <span class="bottom-nav-badge" id="mobile-approval-count" style="display:none;">0</span>
      </a></li>
      <li><a href="#/decisions" class="bottom-nav-link" data-page="decisions" aria-label="Decisions">
        <span class="bottom-nav-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
        </span>Decisions
      </a></li>
      <li><a href="#/settings" class="bottom-nav-link" data-page="settings" aria-label="Settings">
        <span class="bottom-nav-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.6 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.6a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09A1.65 1.65 0 0 0 15 4.6a1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9c.36.13.69.34.96.6"/></svg>
        </span>Settings
      </a></li>
    </ul>
  </nav>

  <script type="module" src="/js/app.js"></script>
</body>
</html>
