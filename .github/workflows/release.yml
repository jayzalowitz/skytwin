# release.yml — Build and publish SkyTwin Desktop to GitHub Releases.
#
# Triggered by pushing a version tag (v*.*.*) or manually via workflow_dispatch.
# Builds on macOS, Windows, and Linux in parallel. Publishes artifacts as a
# GitHub Release using electron-builder's github provider.
#
# ---------------------------------------------------------------------------
# Required GitHub repository secrets
# ---------------------------------------------------------------------------
#
# GITHUB_TOKEN       — auto-provided by GitHub Actions; no setup needed.
#
# macOS code-signing + notarization:
#   APPLE_ID                  Apple ID email (e.g. dev@example.com)
#   APPLE_APP_SPECIFIC_PASSWORD
#                             App-specific password from appleid.apple.com
#                             → Security → App-Specific Passwords
#   APPLE_TEAM_ID             10-character team ID from developer.apple.com
#   MAC_CERT_P12_BASE64       base64-encoded Developer ID Application cert:
#                               base64 -i cert.p12 | pbcopy
#   MAC_CERT_PASSWORD         password used when exporting the .p12
#
# Windows code-signing:
#   WIN_CERT_PFX_BASE64       base64-encoded .pfx file:
#                               base64 -i cert.pfx | pbcopy  (macOS/Linux)
#                               [Convert]::ToBase64String([IO.File]::ReadAllBytes('cert.pfx')) | clip  (PowerShell)
#   WIN_CERT_PASSWORD         password for the .pfx
#
# Until the secrets are added the workflow produces UNSIGNED artifacts, which
# is the same posture as the local dev build. Unsigned builds still auto-update
# correctly; they just trigger OS security warnings on first launch.
# ---------------------------------------------------------------------------

name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

jobs:
  build-and-release:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v6

      # pnpm/action-setup@v5 reads the `packageManager` field from
      # package.json instead of taking a `version:` input. The earlier
      # `@v4 + version: 9` shape failed every release job at setup with
      # `ERR_PNPM_BAD_PM_VERSION: Multiple versions of pnpm specified`
      # because v4 saw both inputs. Aligned with build.yml's v5 usage.
      - uses: pnpm/action-setup@v5

      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: pnpm

      # Skip turbo cache on Windows — the action writes to /tmp which doesn't
      # exist on Windows runners. macOS + Linux still benefit.
      - uses: dtinth/setup-github-actions-caching-for-turbo@v1
        if: matrix.os != 'windows-latest'

      # CRDB binary cache + Defender-exclusion parity with build.yml so the
      # release path doesn't re-discover the same Windows mmap + slow-copy
      # bottlenecks the CI loop already solved. Same cache key shape as
      # build.yml so warm caches from PR runs prime release runs and vice
      # versa.
      - name: Cache electron-builder + CRDB downloads (macOS)
        if: matrix.os == 'macos-latest'
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/electron
            ~/Library/Caches/electron-builder
            ~/.cache/skytwin/crdb-binaries
          key: ${{ runner.os }}-electron-crdb-${{ hashFiles('apps/desktop/package.json', 'apps/desktop/scripts/build-single-binary.sh', 'pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-electron-crdb-
            ${{ runner.os }}-electron-

      - name: Cache electron-builder + CRDB downloads (Linux)
        if: matrix.os == 'ubuntu-latest'
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/electron
            ~/.cache/electron-builder
            ~/.cache/skytwin/crdb-binaries
          key: ${{ runner.os }}-electron-crdb-${{ hashFiles('apps/desktop/package.json', 'apps/desktop/scripts/build-single-binary.sh', 'pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-electron-crdb-
            ${{ runner.os }}-electron-

      - name: Cache electron-builder + CRDB downloads (Windows)
        if: matrix.os == 'windows-latest'
        uses: actions/cache@v4
        with:
          path: |
            ~/AppData/Local/electron/Cache
            ~/AppData/Local/electron-builder/Cache
            ~/.cache/skytwin/crdb-binaries
          key: ${{ runner.os }}-electron-crdb-${{ hashFiles('apps/desktop/package.json', 'apps/desktop/scripts/build-single-binary.sh', 'pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-electron-crdb-
            ${{ runner.os }}-electron-

      # Mirror the Defender exclusion from build.yml so the release Windows
      # job doesn't hit the same makensis mmap race PR #350 fought through.
      - name: Exclude electron-builder workspace from Defender (Windows)
        if: matrix.os == 'windows-latest'
        shell: powershell
        run: |
          Add-MpPreference -ExclusionPath "$env:GITHUB_WORKSPACE" -ErrorAction SilentlyContinue
          Add-MpPreference -ExclusionPath "$env:LOCALAPPDATA\electron-builder\Cache" -ErrorAction SilentlyContinue
          Add-MpPreference -ExclusionPath "$env:LOCALAPPDATA\electron\Cache" -ErrorAction SilentlyContinue
          Write-Host "Defender exclusions added for build workspace + electron-builder caches."

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Build the FULL workspace, not just skytwin-desktop. The desktop
      # build's `tsc && prepackage` chain transitively requires every
      # @skytwin/* workspace dep to be compiled first (api imports
      # llm-client/db/shared-types/credential-vault/decision-engine/etc.,
      # worker too). `pnpm --filter skytwin-desktop build` only invokes
      # desktop's own placeholder build script (a no-op echo) and skips
      # the deps — the prepackage `pnpm --filter @skytwin/api build` then
      # fails with TS2307 "Cannot find module '@skytwin/*'". build.yml
      # uses bare `pnpm build` (line 78, 114, 176, 241) for the same
      # reason; release.yml had drifted.
      - name: Build all workspace packages
        run: pnpm build

      # macOS: inject Apple cert via CSC_LINK so electron-builder can sign.
      # The env vars are read by electron-builder directly; nothing to run here.
      - name: Import Apple cert (macOS)
        if: matrix.os == 'macos-latest'
        env:
          CSC_LINK: ${{ secrets.MAC_CERT_P12_BASE64 }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
        run: echo "Apple cert injected via electron-builder env vars (CSC_LINK / CSC_KEY_PASSWORD)"

      # Windows: same pattern with the PFX cert.
      - name: Set up Windows cert env (Windows)
        if: matrix.os == 'windows-latest'
        env:
          CSC_LINK: ${{ secrets.WIN_CERT_PFX_BASE64 }}
          CSC_KEY_PASSWORD: ${{ secrets.WIN_CERT_PASSWORD }}
        run: echo "Windows cert injected via electron-builder env vars (CSC_LINK / CSC_KEY_PASSWORD)"

      - name: Build and publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # macOS notarization
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          # Code-signing cert (each runner only has one platform's secret set).
          # When the secret is unset, the expression evaluates to '' (empty
          # string), NOT undefined. electron-builder then interprets an
          # empty CSC_LINK as a relative path-to-cert that resolves to the
          # CWD — and crashes with `⨯ <cwd> not a file` before it even
          # starts packaging. Pair CSC_LINK with CSC_IDENTITY_AUTO_DISCOVERY
          # so an empty CSC_LINK falls through cleanly to "skip signing"
          # rather than "look for a cert at CWD." When the secrets ARE set,
          # CSC_LINK takes precedence and auto-discovery is moot.
          CSC_LINK: ${{ matrix.os == 'macos-latest' && secrets.MAC_CERT_P12_BASE64 || secrets.WIN_CERT_PFX_BASE64 }}
          CSC_KEY_PASSWORD: ${{ matrix.os == 'macos-latest' && secrets.MAC_CERT_PASSWORD || secrets.WIN_CERT_PASSWORD }}
          CSC_IDENTITY_AUTO_DISCOVERY: ${{ (matrix.os == 'macos-latest' && secrets.MAC_CERT_P12_BASE64 != '') || (matrix.os == 'windows-latest' && secrets.WIN_CERT_PFX_BASE64 != '') }}
        # Note: NO `--` separator before --publish always. pnpm forwards
        # `--` literally into the script's underlying shell command, so
        # `... run package:mac -- --publish always` ends up as
        # `electron-builder --mac -- --publish always`, where the `--`
        # tells electron-builder "end of options," and the post-`--`
        # `--publish always` is then treated as a positional path arg.
        # electron-builder then errors `apps/desktop not a file` because
        # it's looking for a file at that pseudo-path. The v0.6.58.0 retry
        # tag hit this on all three platforms — fix is to pass the args
        # without the separator (pnpm 7+ forwards flag-args natively).
        run: |
          if [ "${{ matrix.os }}" = "macos-latest" ]; then
            pnpm --filter skytwin-desktop run package:mac --publish always
          elif [ "${{ matrix.os }}" = "windows-latest" ]; then
            pnpm --filter skytwin-desktop run package:win --publish always
          else
            pnpm --filter skytwin-desktop run package:linux --publish always
          fi
        shell: bash
