name: Build & Package

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  # Allow manual runs for cases where the path filter would otherwise
  # skip the desktop/mobile jobs (e.g. a docs-only push to a feature
  # branch when we still want to confirm the desktop bundle builds
  # against the cumulative branch state).
  workflow_dispatch: {}

permissions:
  contents: read

# Cancel stale branch/PR runs, but never interrupt a tag publication run.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/v') }}

env:
  NODE_VERSION: '20'
  # Turbo remote cache — uses the GitHub Actions cache as the backend via
  # dtinth/setup-github-actions-caching-for-turbo. No external account needed.
  # All build jobs share cached package outputs, so the second job onward gets
  # `pnpm build` as cache hits.
  TURBO_TELEMETRY_DISABLED: '1'

jobs:
  # ──────────────────────────────────────────────
  # Change detection — used to skip desktop / mobile packaging on PRs that
  # don't touch those apps. Push events (main + tags) always run everything.
  # ──────────────────────────────────────────────
  changes:
    name: Detect changed paths
    runs-on: ubuntu-latest
    outputs:
      desktop: ${{ steps.filter.outputs.desktop }}
      mobile: ${{ steps.filter.outputs.mobile }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            desktop:
              - 'apps/desktop/**'
              - 'packages/**'
              - 'pnpm-lock.yaml'
              - 'package.json'
              - 'turbo.json'
              - 'VERSION'
              - '.github/workflows/build.yml'
              # The desktop jobs run this to derive the packaged app version;
              # a change to it must re-validate packaging.
              - '.github/scripts/**'
            mobile:
              - 'apps/mobile/**'
              - 'pnpm-lock.yaml'
              - 'package.json'
              - 'turbo.json'
              - '.github/workflows/build.yml'

  # ──────────────────────────────────────────────
  # Tests — gate all builds behind passing tests
  # ──────────────────────────────────────────────
  test:
    name: release-claim-ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v5

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      # Turbo cache is opportunistic; GitHub cache API failures must not fail
      # correctness gates after install/build/test pass.
      - name: Set up Turbo remote cache
        uses: dtinth/setup-github-actions-caching-for-turbo@v1
        continue-on-error: true

      - run: pnpm install --frozen-lockfile
      - name: Validate encryption field inventory
        run: pnpm check:encryption-inventory
      - name: Install CockroachDB for migration integration tests
        run: |
          curl --fail --location --retry 3 --output cockroach.tgz https://binaries.cockroachdb.com/cockroach-v26.1.0.linux-amd64.tgz
          echo "096e2d40a2b30ce296c13652b839e04612003aef2820cfc5b8d712d06c9d0d86  cockroach.tgz" | sha256sum --check
          tar --extract --gzip --file cockroach.tgz
          sudo install --mode 0755 cockroach-v26.1.0.linux-amd64/cockroach /usr/local/bin/cockroach
      - name: Validate beta release claims
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          pnpm claims:check
          # Every v* tag can reach the draft-release job, so every such tag is
          # gated. The checker validates the exact tag against the ledger and
          # safely normalizes beta tags onto the repo's four-segment VERSION.
          if [[ "${GITHUB_REF_TYPE}" == "tag" && "${GITHUB_REF_NAME}" == v* ]]; then
            pnpm claims:check -- --require-ready --preflight --tag "${GITHUB_REF_NAME}" --commit "${GITHUB_SHA}" --repository "${GITHUB_REPOSITORY}" --run-id "${GITHUB_RUN_ID}" --ref "${GITHUB_REF}"
          fi
      - name: Test beta release-claim guard
        run: pnpm claims:test
      - run: pnpm build
      - run: pnpm test

      # Guardrail (#380): block any push that hardcodes a literal
      # version into the README badge URL. The badge is a dynamic
      # shields.io URL that reads package.json on every render; any
      # `badge/version-0.X.Y` literal would re-introduce the 35-release
      # staleness this issue closed. grep returns 0 (match) → exit 1.
      - name: README badge must stay dynamic (#380)
        run: |
          if grep -E "/badge/version-[0-9]" README.md; then
            echo "::error file=README.md::README version badge appears to be hardcoded. Use the dynamic shields.io URL (img.shields.io/github/package-json/v/...) so it never goes stale."
            exit 1
          fi

  migration-rollback-cockroach:
    name: Migration rollback — CockroachDB
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build workspace dependencies for focused E2E imports
        run: pnpm build --concurrency=1
      - name: Start disposable CockroachDB
        run: |
          # The image's shell entrypoint rejects wildcard listen addresses even
          # though the Cockroach binary supports them. Bypass only that wrapper
          # so Docker's port forwarding can reach SQL, while binding the host
          # side to loopback keeps this insecure test node runner-local.
          docker run --detach --name skytwin-migration-crdb \
            --publish 127.0.0.1:26257:26257 \
            --entrypoint /cockroach/cockroach \
            cockroachdb/cockroach:latest-v23.2 \
            start-single-node --insecure --listen-addr=0.0.0.0:26257
          for _ in $(seq 1 60); do
            if docker exec skytwin-migration-crdb cockroach sql --insecure --execute 'SELECT 1'; then
              exit 0
            fi
            sleep 1
          done
          docker logs skytwin-migration-crdb
          exit 1
      - name: Verify owned-schema rollback and reapply
        env:
          DATABASE_URL: postgresql://root@127.0.0.1:26257/defaultdb?sslmode=disable
          E2E: 'true'
          MIGRATION_ROLLBACK_E2E: 'true'
        run: pnpm --filter @skytwin/db exec vitest run src/__tests__/migration-rollback.e2e.test.ts
      - name: Verify admission, purge, and restore races
        env:
          DATABASE_URL: postgresql://root@127.0.0.1:26257/defaultdb?sslmode=disable
          E2E: 'true'
        run: |
          pnpm --filter @skytwin/db migrate
          pnpm --filter @skytwin/db exec vitest run src/__tests__/inference-receipt-repository.e2e.test.ts

  # ──────────────────────────────────────────────
  # Desktop — one job per OS, uploads installer artifacts
  # ──────────────────────────────────────────────
  desktop-mac:
    name: Desktop — macOS (DMG + ZIP)
    needs: [test, changes]
    if: github.event_name != 'pull_request' || needs.changes.outputs.desktop == 'true'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v5

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Set up Turbo remote cache
        uses: dtinth/setup-github-actions-caching-for-turbo@v1
        continue-on-error: true

      - name: Cache electron-builder + CRDB downloads
        uses: actions/cache@v6
        with:
          path: |
            ~/Library/Caches/electron
            ~/Library/Caches/electron-builder
            ~/.cache/skytwin/crdb-binaries
          key: ${{ runner.os }}-electron-crdb-${{ hashFiles('apps/desktop/package.json', 'apps/desktop/scripts/build-single-binary.sh', 'pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-electron-crdb-
            ${{ runner.os }}-electron-

      - run: pnpm install --frozen-lockfile
      - run: pnpm build

      # #370 follow-up: derive the electron-builder app version from the
      # four-segment root VERSION. See the long comment on the macOS package
      # step below and .github/scripts/derive-app-version.sh for why. `shell:
      # bash` is explicit so this step behaves identically on the Windows
      # runner (whose default shell is pwsh).
      - name: Derive app version
        shell: bash
        run: bash .github/scripts/derive-app-version.sh

      - name: Package macOS desktop app
        # `--publish never` is critical: the per-package step must NOT
        # auto-publish. electron-builder's default heuristic would otherwise
        # try to upload to GitHub Releases without a GH_TOKEN on this step,
        # failing the whole macOS job. Publishing is handled separately by
        # the `release` job at the bottom of this file (softprops, tag-only,
        # draft) — these matrix jobs only validate packageability and hand
        # their artifacts to that job. (History: the old release.yml was
        # deleted in #356; build.yml is now the only publisher.)
        #
        # `--config.extraMetadata.version` is equally critical. electron-builder
        # stamps BOTH the artifact filenames AND the latest*.yml update
        # manifests from the app's package.json version, and that file is
        # pinned to `0.3.0` (electron-builder rejects our four-segment
        # VERSION, so it can't simply be copied in). Without this flag every
        # release publishes `0.3.0` and electron-updater's semver compare
        # against an installed `0.3.0` answers "no update available" forever.
        # The value comes from the `Derive app version` step above, which
        # hard-fails on anything that isn't four numeric segments — so
        # APP_VERSION is always [0-9.]+ and safe to interpolate here.
        # Guarded by apps/desktop/src/__tests__/app-version-injection.test.ts.
        run: pnpm --filter skytwin-desktop run package:mac --publish never "--config.extraMetadata.version=${{ env.APP_VERSION }}"
        env:
          # Skip code signing for CI builds (not notarized)
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Upload macOS DMG
        uses: actions/upload-artifact@v7
        with:
          name: SkyTwin-macOS-dmg
          path: apps/desktop/dist-electron/*.dmg
          if-no-files-found: error

      - name: Upload macOS ZIP
        uses: actions/upload-artifact@v7
        with:
          name: SkyTwin-macOS-zip
          path: apps/desktop/dist-electron/*.zip
          if-no-files-found: error

      # #370: electron-updater polls latest-mac.yml (version + sha512 of the
      # zip) to discover updates. electron-builder writes it into
      # dist-electron/ as part of packaging — `--publish never` only skips the
      # UPLOAD, not the manifest generation — so we collect it here and the
      # `release` job attaches it. Without this asset on the Release, an
      # installed app's checkForUpdates() against the GitHub provider fails.
      - name: Upload macOS update manifest (latest-mac.yml)
        uses: actions/upload-artifact@v7
        with:
          name: SkyTwin-macOS-update-manifest
          path: apps/desktop/dist-electron/latest-mac.yml
          # warn, not error: electron-builder emits this under `--publish never`
          # in the common case, but gating a tagged build's PASS on its presence
          # is too brittle for the release pipeline — a missing manifest must
          # never break publishing the installers. The feed-reachability gate
          # below + a tag dry-run are the real confirmation auto-update is wired.
          if-no-files-found: warn

  desktop-windows:
    name: Desktop — Windows (NSIS installer)
    needs: [test, changes]
    if: github.event_name != 'pull_request' || needs.changes.outputs.desktop == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v5

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      # Turbo remote cache action is skipped on Windows — dtinth/setup-...@v1
      # writes to /tmp/turbogha.log which doesn't exist on Windows runners
      # (ENOENT on D:\tmp\turbogha.log). Electron-builder packaging dominates
      # wall-clock here; missing the TS-compile cache is negligible.

      - name: Cache electron-builder + CRDB downloads
        uses: actions/cache@v6
        with:
          path: |
            ~/AppData/Local/electron/Cache
            ~/AppData/Local/electron-builder/Cache
            ~/.cache/skytwin/crdb-binaries
          key: ${{ runner.os }}-electron-crdb-${{ hashFiles('apps/desktop/package.json', 'apps/desktop/scripts/build-single-binary.sh', 'pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-electron-crdb-
            ${{ runner.os }}-electron-

      - run: pnpm install --frozen-lockfile
      - run: pnpm build

      # Exclude the electron-builder workspace from Windows Defender
      # real-time scanning. NSIS's makensis is a 32-bit process that
      # mmaps the intermediate `.nsis.7z` archive into its address space;
      # when Defender opens the freshly-written .7z for a real-time scan
      # before mmap fires, makensis gets a sharing-violation error that
      # surfaces as `File: failed creating mmap of ...nsis.7z`. Two prior
      # runs failed at the same makensis step with identical errors,
      # neither caused by anything in the code — both were Defender
      # racing the .7z write. Adding the workspace + electron-builder
      # cache as ExclusionPaths is the documented electron-builder
      # workaround (issue #6107) and only affects this Windows runner.
      # We exclude paths instead of disabling Defender wholesale so the
      # cockroach.exe signtool step (which IS scanned by Defender) keeps
      # its safety net.
      - name: Exclude electron-builder workspace from Defender
        shell: powershell
        run: |
          Add-MpPreference -ExclusionPath "$env:GITHUB_WORKSPACE" -ErrorAction SilentlyContinue
          Add-MpPreference -ExclusionPath "$env:LOCALAPPDATA\electron-builder\Cache" -ErrorAction SilentlyContinue
          Add-MpPreference -ExclusionPath "$env:LOCALAPPDATA\electron\Cache" -ErrorAction SilentlyContinue
          Write-Host "Defender exclusions added for build workspace + electron-builder caches."

      # See the macOS job for why the version is derived rather than read
      # straight out of apps/desktop/package.json.
      - name: Derive app version
        shell: bash
        run: bash .github/scripts/derive-app-version.sh

      - name: Package Windows desktop app
        # See macOS comment re: --publish never and
        # --config.extraMetadata.version; same reasoning here. `${{ env.… }}`
        # is a workflow-level expression substituted before the shell runs, so
        # it resolves identically under this job's default pwsh shell (where a
        # bare `${APP_VERSION}` would NOT — pwsh spells env vars `$env:X`).
        run: pnpm --filter skytwin-desktop run package:win --publish never "--config.extraMetadata.version=${{ env.APP_VERSION }}"

      - name: Upload Windows installer
        uses: actions/upload-artifact@v7
        with:
          name: SkyTwin-Windows-installer
          path: apps/desktop/dist-electron/*.exe
          if-no-files-found: error

      # #370: latest.yml is the Windows update manifest electron-updater polls.
      # Generated by electron-builder alongside the NSIS installer regardless
      # of `--publish never`; collected here so the `release` job attaches it.
      - name: Upload Windows update manifest (latest.yml)
        uses: actions/upload-artifact@v7
        with:
          name: SkyTwin-Windows-update-manifest
          path: apps/desktop/dist-electron/latest.yml
          # warn, not error: same rationale as the macOS manifest step above —
          # a missing update manifest must not break publishing the installer.
          if-no-files-found: warn

  desktop-linux:
    name: Desktop — Linux (AppImage + deb + rpm)
    needs: [test, changes]
    if: github.event_name != 'pull_request' || needs.changes.outputs.desktop == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v5

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Set up Turbo remote cache
        uses: dtinth/setup-github-actions-caching-for-turbo@v1
        continue-on-error: true

      - name: Cache electron-builder + CRDB downloads
        uses: actions/cache@v6
        with:
          path: |
            ~/.cache/electron
            ~/.cache/electron-builder
            ~/.cache/skytwin/crdb-binaries
          key: ${{ runner.os }}-electron-crdb-${{ hashFiles('apps/desktop/package.json', 'apps/desktop/scripts/build-single-binary.sh', 'pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-electron-crdb-
            ${{ runner.os }}-electron-

      - run: pnpm install --frozen-lockfile
      - run: pnpm build

      # See the macOS job for why the version is derived rather than read
      # straight out of apps/desktop/package.json.
      - name: Derive app version
        shell: bash
        run: bash .github/scripts/derive-app-version.sh

      - name: Package Linux desktop app
        # See macOS comment re: --publish never and
        # --config.extraMetadata.version; same reasoning here.
        run: pnpm --filter skytwin-desktop run package:linux --publish never "--config.extraMetadata.version=${{ env.APP_VERSION }}"
        continue-on-error: true

      - name: Upload Linux AppImage
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: SkyTwin-Linux-AppImage
          path: apps/desktop/dist-electron/*.AppImage
          if-no-files-found: warn

      - name: Upload Linux deb
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: SkyTwin-Linux-deb
          path: apps/desktop/dist-electron/*.deb
          if-no-files-found: warn

      - name: Upload Linux rpm
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: SkyTwin-Linux-rpm
          path: apps/desktop/dist-electron/*.rpm
          if-no-files-found: warn

      # #370: latest-linux.yml is the Linux update manifest electron-updater
      # polls (AppImage channel). Generated alongside the AppImage; collected
      # here so the `release` job attaches it. `warn` (not `error`) matches the
      # Linux package step's own `continue-on-error: true` tolerance — a Linux
      # packaging hiccup must not fail the whole tagged build.
      - name: Upload Linux update manifest (latest-linux.yml)
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: SkyTwin-Linux-update-manifest
          path: apps/desktop/dist-electron/latest-linux.yml
          if-no-files-found: warn

  # ──────────────────────────────────────────────
  # Mobile — Android APK (no signing certs needed for internal distribution)
  # ──────────────────────────────────────────────
  mobile-android:
    name: Mobile — Android APK
    needs: [test, changes]
    if: github.event_name != 'pull_request' || needs.changes.outputs.mobile == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v5

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Gradle (cached)
        uses: gradle/actions/setup-gradle@v6

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Set up Turbo remote cache
        uses: dtinth/setup-github-actions-caching-for-turbo@v1
        continue-on-error: true

      - run: pnpm install --frozen-lockfile

      - name: Install Expo CLI
        run: npx expo --version
        working-directory: apps/mobile

      - name: Prebuild Android project
        run: npx expo prebuild --platform android --no-install
        working-directory: apps/mobile
        continue-on-error: true

      - name: Install native dependencies
        run: pnpm install --frozen-lockfile
        working-directory: apps/mobile
        continue-on-error: true

      - name: Build Android APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease
        working-directory: apps/mobile
        continue-on-error: true

      - name: Upload Android APK
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: SkyTwin-Android-apk
          path: apps/mobile/android/app/build/outputs/apk/release/*.apk
          if-no-files-found: warn

  # ──────────────────────────────────────────────
  # Mobile — iOS (unsigned .app for simulator / TestFlight prep)
  # ──────────────────────────────────────────────
  mobile-ios:
    name: Mobile — iOS (simulator build)
    needs: [test, changes]
    if: github.event_name != 'pull_request' || needs.changes.outputs.mobile == 'true'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v5

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Set up Turbo remote cache
        uses: dtinth/setup-github-actions-caching-for-turbo@v1
        continue-on-error: true

      - name: Cache CocoaPods
        uses: actions/cache@v6
        with:
          path: |
            apps/mobile/ios/Pods
            ~/Library/Caches/CocoaPods
          key: ${{ runner.os }}-pods-${{ hashFiles('apps/mobile/ios/Podfile.lock') }}
          restore-keys: |
            ${{ runner.os }}-pods-

      - run: pnpm install --frozen-lockfile

      - name: Install Expo CLI
        run: npx expo --version
        working-directory: apps/mobile

      - name: Prebuild iOS project
        run: npx expo prebuild --platform ios --no-install
        working-directory: apps/mobile
        continue-on-error: true

      - name: Install native dependencies
        run: pnpm install --frozen-lockfile
        working-directory: apps/mobile
        continue-on-error: true

      - name: Install CocoaPods
        run: |
          cd ios
          pod install
        working-directory: apps/mobile
        continue-on-error: true

      - name: Build iOS simulator app
        run: |
          xcodebuild \
            -workspace ios/SkyTwin.xcworkspace \
            -scheme SkyTwin \
            -configuration Release \
            -sdk iphonesimulator \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            | xcpretty
        working-directory: apps/mobile
        continue-on-error: true

      - name: Package iOS simulator build
        run: |
          cd build/Build/Products/Release-iphonesimulator
          zip -r ../../../../SkyTwin-iOS-simulator.zip SkyTwin.app
        working-directory: apps/mobile
        continue-on-error: true

      - name: Upload iOS simulator build
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: SkyTwin-iOS-simulator
          path: apps/mobile/SkyTwin-iOS-simulator.zip
          if-no-files-found: warn

  # The reviewed machine-verifier scripts land in the evidence-producing
  # follow-up. Until they exist, tag builds stop here instead of accepting a
  # hand-authored passing report.
  release-machine-evidence:
    name: release-machine-evidence / ${{ matrix.claimId }} / ${{ matrix.platform }}
    if: startsWith(github.ref, 'refs/tags/v')
    needs:
      - desktop-mac
      - desktop-windows
      - desktop-linux
    permissions:
      contents: read
      actions: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - claimId: storage.desktop-crdb
            platform: macos
            runner: macos-15
            reportName: storage.desktop-crdb.json
          - claimId: inference.on-device-availability
            platform: macos
            runner: macos-15
            reportName: inference.on-device-availability.json
          - claimId: inference.confidential-verification
            platform: linux
            runner: ubuntu-24.04
            reportName: inference.confidential-verification.json
          - claimId: network.explicit-boundaries
            platform: macos
            runner: macos-15
            reportName: network.explicit-boundaries.json
          - claimId: sample.packaged-account-free
            platform: macos
            runner: macos-15
            reportName: sample.packaged-account-free.macos.json
          - claimId: sample.packaged-account-free
            platform: windows
            runner: windows-2025
            reportName: sample.packaged-account-free.windows.json
          - claimId: sample.packaged-account-free
            platform: linux
            runner: ubuntu-24.04
            reportName: sample.packaged-account-free.linux.json
          - claimId: models.verified-delivery
            platform: linux
            runner: ubuntu-24.04
            reportName: models.verified-delivery.json
          - claimId: release.signing
            platform: macos
            runner: macos-15
            reportName: release.signing.macos.json
          - claimId: release.signing
            platform: windows
            runner: windows-2025
            reportName: release.signing.windows.json
          - claimId: release.signing
            platform: linux
            runner: ubuntu-24.04
            reportName: release.signing.linux.json
          - claimId: release.artifact-verification
            platform: linux
            runner: ubuntu-24.04
            reportName: release.artifact-verification.json
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          path: artifacts
      - name: Run canonical machine verifier
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/release-claims/verifiers/${{ matrix.claimId }}.mjs --platform ${{ matrix.platform }} --output .release-evidence/reports/${{ matrix.reportName }}
      - name: Upload machine evidence report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: release-machine-evidence-${{ matrix.claimId }}-${{ matrix.platform }}
          path: .release-evidence/reports/${{ matrix.reportName }}
          if-no-files-found: error
          compression-level: 0

  aggregate-release-evidence:
    name: Aggregate release machine evidence
    if: startsWith(github.ref, 'refs/tags/v')
    needs: release-machine-evidence
    runs-on: ubuntu-24.04
    steps:
      - name: Download machine evidence reports
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          pattern: release-machine-evidence-*
          path: .release-evidence/reports
          merge-multiple: true
      - name: Upload aggregated release evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: release-evidence
          path: .release-evidence
          if-no-files-found: error
          compression-level: 0

  # ──────────────────────────────────────────────
  # Release — attach all artifacts to GitHub Release on tag push
  # ──────────────────────────────────────────────
  #
  # History: this job was deleted in PR #352 to avoid double-publishing
  # against release.yml's electron-builder Github publisher. release.yml
  # then failed FIVE consecutive release attempts (pnpm setup, workspace
  # build, --publish arg forwarding, CSC empty-string, ...). Each fix
  # surfaced the next bug because release.yml was never tested
  # end-to-end. Reverting: this simpler softprops-based path downloads
  # the artifacts the desktop-mac/win/linux jobs already produce
  # successfully (build.yml's matrix is well-exercised) and creates a
  # draft GitHub Release. release.yml was deleted entirely in the same
  # PR — build.yml is now the only publisher.
  release:
    name: Create GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs:
      - test
      - desktop-mac
      - desktop-windows
      - desktop-linux
      - aggregate-release-evidence
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: release-publication
    concurrency:
      group: release-publication-${{ github.ref }}
      cancel-in-progress: false
    permissions:
      contents: write
      actions: read
      attestations: read
    steps:
      # #370 AC#2: confirm the GitHub Releases endpoint this repo's
      # electron-updater feed lives behind is reachable before we publish a
      # new release onto it. `-f` makes curl exit non-zero on any HTTP >= 400,
      # so a non-2xx (auth/outage/repo-rename) fails the job instead of
      # shipping a release to a feed installed clients can't reach. The
      # endpoint 404s only before the very first release exists; once any
      # release is published it returns 2xx, so this is a steady-state gate.
      # --retry rides out transient GitHub 5xx blips without masking a real
      # outage (3 attempts, exponential backoff).
      - name: Verify update feed reachable
        run: |
          curl -fsSL --max-time 10 --retry 3 --retry-delay 2 \
            "https://github.com/${{ github.repository }}/releases/latest" \
            -o /dev/null

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install release claim checker
        run: corepack pnpm@9.1.0 install --frozen-lockfile --ignore-scripts --filter skytwin

      # Checkout must precede download: checkout's default clean would remove
      # the untracked artifacts directory if these steps were reversed.
      - name: Download all artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          path: artifacts

      - name: Verify post-build release evidence
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          # Fail closed until an upstream job supplies digest-bound reports.
          # The manifest is generated outside the evidence artifact so it can
          # bind that artifact and the release artifacts without a hash cycle.
          cp -R artifacts/release-evidence .release-evidence
          node scripts/release-claims/generate-evidence-manifest.mjs \
            docs/beta-claim-ledger.json \
            .release-evidence/reports \
            .release-evidence/manifest.json
          node scripts/release-claims/check-release-claims.mjs \
            --require-ready \
            --tag "${GITHUB_REF_NAME}" \
            --commit "${GITHUB_SHA}" \
            --repository "${GITHUB_REPOSITORY}" \
            --run-id "${GITHUB_RUN_ID}" \
            --ref "${GITHUB_REF}" \
            --evidence-manifest .release-evidence/manifest.json

      - name: List artifacts
        run: find artifacts -type f | sort

      # A missing environment is auto-created by GitHub without protection.
      # Verify the live settings after the environment gate so absence or drift
      # still fails closed before any release mutation.
      - name: Verify protected release environment
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/release-claims/verify-release-environment.mjs

      - name: Refuse an existing release tag
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/release-claims/publish-verified-draft.mjs --assert-absent

      # target_commitish is ignored for an existing tag. Dereference the tag
      # itself immediately before draft creation, including annotated tags,
      # and reject any source commit not already merged into main.
      - name: Verify release tag target and main ancestry
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/release-claims/publish-verified-draft.mjs --assert-tag-target

      - name: Create release
        id: create-release-draft
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64
        with:
          draft: true
          prerelease: true
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            artifacts/SkyTwin-macOS-dmg/*
            artifacts/SkyTwin-macOS-zip/*
            artifacts/SkyTwin-macOS-update-manifest/*
            artifacts/SkyTwin-Windows-installer/*
            artifacts/SkyTwin-Windows-update-manifest/*
            artifacts/SkyTwin-Linux-AppImage/*
            artifacts/SkyTwin-Linux-deb/*
            artifacts/SkyTwin-Linux-rpm/*
            artifacts/SkyTwin-Linux-update-manifest/*
            artifacts/release-claims-ci/result.json
            .release-evidence/reports/storage.desktop-crdb.json
            .release-evidence/reports/inference.on-device-availability.json
            .release-evidence/reports/inference.confidential-verification.json
            .release-evidence/reports/network.explicit-boundaries.json
            .release-evidence/reports/sample.packaged-account-free.macos.json
            .release-evidence/reports/sample.packaged-account-free.windows.json
            .release-evidence/reports/sample.packaged-account-free.linux.json
            .release-evidence/reports/models.verified-delivery.json
            .release-evidence/reports/release.signing.macos.json
            .release-evidence/reports/release.signing.windows.json
            .release-evidence/reports/release.signing.linux.json
            .release-evidence/reports/release.artifact-verification.json
            .release-evidence/artifact-verification/*
            .release-evidence/manifest.json

      - name: Verify exact draft assets and publish
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ steps.create-release-draft.outputs.id }}
        run: node scripts/release-claims/publish-verified-draft.mjs .release-evidence/manifest.json
