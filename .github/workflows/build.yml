name: Build & Package

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

# Cancel in-progress runs for the same branch/PR
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '20'
  # Turbo remote cache — uses the GitHub Actions cache as the backend via
  # dtinth/setup-github-actions-caching-for-turbo. No external account needed.
  # All build jobs share cached package outputs, so the second job onward gets
  # `pnpm build` as cache hits.
  TURBO_TELEMETRY_DISABLED: '1'

jobs:
  # ──────────────────────────────────────────────
  # Change detection — used to skip desktop / mobile packaging on PRs that
  # don't touch those apps. Push events (main + tags) always run everything.
  # ──────────────────────────────────────────────
  changes:
    name: Detect changed paths
    runs-on: ubuntu-latest
    outputs:
      desktop: ${{ steps.filter.outputs.desktop }}
      mobile: ${{ steps.filter.outputs.mobile }}
    steps:
      - uses: actions/checkout@v6
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            desktop:
              - 'apps/desktop/**'
              - 'packages/**'
              - 'pnpm-lock.yaml'
              - 'package.json'
              - 'turbo.json'
              - '.github/workflows/build.yml'
            mobile:
              - 'apps/mobile/**'
              - 'pnpm-lock.yaml'
              - 'package.json'
              - '.github/workflows/build.yml'

  # ──────────────────────────────────────────────
  # Tests — gate all builds behind passing tests
  # ──────────────────────────────────────────────
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v5

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - uses: dtinth/setup-github-actions-caching-for-turbo@v1

      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm test

  # ──────────────────────────────────────────────
  # Desktop — one job per OS, uploads installer artifacts
  # ──────────────────────────────────────────────
  desktop-mac:
    name: Desktop — macOS (DMG + ZIP)
    needs: [test, changes]
    if: github.event_name != 'pull_request' || needs.changes.outputs.desktop == 'true'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v5

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - uses: dtinth/setup-github-actions-caching-for-turbo@v1

      - name: Cache electron-builder downloads
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/electron
            ~/Library/Caches/electron-builder
          key: ${{ runner.os }}-electron-${{ hashFiles('apps/desktop/package.json', 'pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-electron-

      - run: pnpm install --frozen-lockfile
      - run: pnpm build

      - name: Package macOS desktop app
        run: pnpm --filter @skytwin/desktop package:mac
        env:
          # Skip code signing for CI builds (not notarized)
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Upload macOS DMG
        uses: actions/upload-artifact@v7
        with:
          name: SkyTwin-macOS-dmg
          path: apps/desktop/dist-electron/*.dmg
          if-no-files-found: error

      - name: Upload macOS ZIP
        uses: actions/upload-artifact@v7
        with:
          name: SkyTwin-macOS-zip
          path: apps/desktop/dist-electron/*.zip
          if-no-files-found: error

  desktop-windows:
    name: Desktop — Windows (NSIS installer)
    needs: [test, changes]
    if: github.event_name != 'pull_request' || needs.changes.outputs.desktop == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v5

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - uses: dtinth/setup-github-actions-caching-for-turbo@v1

      - name: Cache electron-builder downloads
        uses: actions/cache@v4
        with:
          path: |
            ~/AppData/Local/electron/Cache
            ~/AppData/Local/electron-builder/Cache
          key: ${{ runner.os }}-electron-${{ hashFiles('apps/desktop/package.json', 'pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-electron-

      - run: pnpm install --frozen-lockfile
      - run: pnpm build

      - name: Package Windows desktop app
        run: pnpm --filter @skytwin/desktop package:win

      - name: Upload Windows installer
        uses: actions/upload-artifact@v7
        with:
          name: SkyTwin-Windows-installer
          path: apps/desktop/dist-electron/*.exe
          if-no-files-found: error

  desktop-linux:
    name: Desktop — Linux (AppImage + deb + rpm)
    needs: [test, changes]
    if: github.event_name != 'pull_request' || needs.changes.outputs.desktop == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v5

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - uses: dtinth/setup-github-actions-caching-for-turbo@v1

      - name: Cache electron-builder downloads
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/electron
            ~/.cache/electron-builder
          key: ${{ runner.os }}-electron-${{ hashFiles('apps/desktop/package.json', 'pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-electron-

      - run: pnpm install --frozen-lockfile
      - run: pnpm build

      - name: Package Linux desktop app
        run: pnpm --filter @skytwin/desktop package:linux
        continue-on-error: true

      - name: Upload Linux AppImage
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: SkyTwin-Linux-AppImage
          path: apps/desktop/dist-electron/*.AppImage
          if-no-files-found: warn

      - name: Upload Linux deb
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: SkyTwin-Linux-deb
          path: apps/desktop/dist-electron/*.deb
          if-no-files-found: warn

      - name: Upload Linux rpm
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: SkyTwin-Linux-rpm
          path: apps/desktop/dist-electron/*.rpm
          if-no-files-found: warn

  # ──────────────────────────────────────────────
  # Mobile — Android APK (no signing certs needed for internal distribution)
  # ──────────────────────────────────────────────
  mobile-android:
    name: Mobile — Android APK
    needs: [test, changes]
    if: github.event_name != 'pull_request' || needs.changes.outputs.mobile == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v5

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Gradle (cached)
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - uses: dtinth/setup-github-actions-caching-for-turbo@v1

      - run: pnpm install --frozen-lockfile

      - name: Install Expo CLI
        run: npx expo --version
        working-directory: apps/mobile

      - name: Prebuild Android project
        run: npx expo prebuild --platform android --no-install
        working-directory: apps/mobile
        continue-on-error: true

      - name: Install native dependencies
        run: pnpm install --frozen-lockfile
        working-directory: apps/mobile
        continue-on-error: true

      - name: Build Android APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease
        working-directory: apps/mobile
        continue-on-error: true

      - name: Upload Android APK
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: SkyTwin-Android-apk
          path: apps/mobile/android/app/build/outputs/apk/release/*.apk
          if-no-files-found: warn

  # ──────────────────────────────────────────────
  # Mobile — iOS (unsigned .app for simulator / TestFlight prep)
  # ──────────────────────────────────────────────
  mobile-ios:
    name: Mobile — iOS (simulator build)
    needs: [test, changes]
    if: github.event_name != 'pull_request' || needs.changes.outputs.mobile == 'true'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v5

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - uses: dtinth/setup-github-actions-caching-for-turbo@v1

      - name: Cache CocoaPods
        uses: actions/cache@v4
        with:
          path: |
            apps/mobile/ios/Pods
            ~/Library/Caches/CocoaPods
          key: ${{ runner.os }}-pods-${{ hashFiles('apps/mobile/ios/Podfile.lock') }}
          restore-keys: |
            ${{ runner.os }}-pods-

      - run: pnpm install --frozen-lockfile

      - name: Install Expo CLI
        run: npx expo --version
        working-directory: apps/mobile

      - name: Prebuild iOS project
        run: npx expo prebuild --platform ios --no-install
        working-directory: apps/mobile
        continue-on-error: true

      - name: Install native dependencies
        run: pnpm install --frozen-lockfile
        working-directory: apps/mobile
        continue-on-error: true

      - name: Install CocoaPods
        run: |
          cd ios
          pod install
        working-directory: apps/mobile
        continue-on-error: true

      - name: Build iOS simulator app
        run: |
          xcodebuild \
            -workspace ios/SkyTwin.xcworkspace \
            -scheme SkyTwin \
            -configuration Release \
            -sdk iphonesimulator \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            | xcpretty
        working-directory: apps/mobile
        continue-on-error: true

      - name: Package iOS simulator build
        run: |
          cd build/Build/Products/Release-iphonesimulator
          zip -r ../../../../SkyTwin-iOS-simulator.zip SkyTwin.app
        working-directory: apps/mobile
        continue-on-error: true

      - name: Upload iOS simulator build
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: SkyTwin-iOS-simulator
          path: apps/mobile/SkyTwin-iOS-simulator.zip
          if-no-files-found: warn

  # ──────────────────────────────────────────────
  # Release — attach all artifacts to GitHub Release on tag push
  # ──────────────────────────────────────────────
  release:
    name: Create GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs:
      - desktop-mac
      - desktop-windows
      - desktop-linux
      - mobile-android
      - mobile-ios
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: List artifacts
        run: find artifacts -type f | sort

      - name: Create release
        uses: softprops/action-gh-release@v3
        with:
          draft: true
          generate_release_notes: true
          files: |
            artifacts/SkyTwin-macOS-dmg/*
            artifacts/SkyTwin-macOS-zip/*
            artifacts/SkyTwin-Windows-installer/*
            artifacts/SkyTwin-Linux-AppImage/*
            artifacts/SkyTwin-Linux-deb/*
            artifacts/SkyTwin-Linux-rpm/*
            artifacts/SkyTwin-Android-apk/*
            artifacts/SkyTwin-iOS-simulator/*
