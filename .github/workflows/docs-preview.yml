name: Documentation Preview

on:
  pull_request:
    branches: [main]
    paths:
      - "docs/**"
      - "README.md"
      - ".github/workflows/docs-preview.yml"

permissions:
  contents: read

jobs:
  package-preview:
    name: Package viewable documentation preview
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Verify static documentation links
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { existsSync, readdirSync, readFileSync } from 'node:fs';

          const docsRoot = 'docs';
          const pages = readdirSync(docsRoot).filter((file) => file.endsWith('.html'));
          const missing = [];
          const readPage = (page) => readFileSync(`${docsRoot}/${page}`, 'utf8');

          for (const page of pages) {
            const html = readPage(page);
            if (!html.includes('<title>')) missing.push(`${page} has no title`);

            for (const match of html.matchAll(/href="([^"]+)"/g)) {
              const href = match[1];
              if (href.includes('://') || href.startsWith('mailto:')) continue;

              const [target = '', fragment] = href.split('#', 2);
              const targetPage = target || page;
              if (!targetPage.endsWith('.html')) continue;
              if (!existsSync(`${docsRoot}/${targetPage}`)) {
                missing.push(`${page} -> ${href}`);
                continue;
              }
              if (fragment && !new RegExp(`\\bid=["']${fragment}["']`).test(readPage(targetPage))) {
                missing.push(`${page} -> ${href} (missing fragment)`);
              }
            }
          }

          if (missing.length) {
            console.error(missing.join('\n'));
            process.exit(1);
          }
          console.log(`verified ${pages.length} static Pages documents and local fragments`);
          NODE

      - name: Upload viewable static-site artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v4
        with:
          name: skytwin-documentation-preview
          path: docs
          if-no-files-found: error
          retention-days: 14
